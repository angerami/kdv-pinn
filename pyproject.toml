[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdv-pinn"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
train = ["mlflow>=2.9"]
app = ["streamlit>=1.28"]
foundation = ["torch-geometric>=2.5"]
dev = ["pytest>=7.0", "ruff>=0.1", "ipython>=8.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kdv_pinn = ["*.md"]

[tool.ruff]
line-length = 100
